services:
  app:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports:
      - '127.0.0.1:${TAIWAN_HOST_PORT:-18080}:8080'
    volumes:
      - taiwan-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'
volumes:
  taiwan-data:
